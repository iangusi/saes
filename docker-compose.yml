services:
  # MySQL Database
  db:
    image: mysql:8.4
    container_name: saes2-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-saes2}
      MYSQL_USER: ${DB_USER:-root}
      MYSQL_PASSWORD: ${DB_PASS:-root}
      MYSQL_ROOT_HOST: '%'
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER}", "-p${DB_PASS}"]
      timeout: 20s
      retries: 10
      interval: 10s
    networks:
      - saes2-network

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: saes2-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:-root}
      DB_NAME: ${DB_NAME:-saes2}
      PORT: ${API_PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_key_min_32_chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-no-reply@saes2.edu.mx}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./apps/api/src:/app/apps/api/src:ro
    networks:
      - saes2-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      timeout: 10s
      retries: 3
      interval: 30s

  # AI/Chatbot Service
  ai:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: saes2-ai
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - "${AI_PORT:-8000}:8000"
    volumes:
      - ./ai:/app
    networks:
      - saes2-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/docs')"]
      timeout: 10s
      retries: 3
      interval: 30s

  # Web UI
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: saes2-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:3000}
      AI_BASE_URL: ${AI_BASE_URL:-http://ai:8000}
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - saes2-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      timeout: 10s
      retries: 3
      interval: 30s

volumes:
  db_data:
    driver: local

networks:
  saes2-network:
    driver: bridge
